name: implementation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Check source and design pins
        run: |
          python3 scripts/check_upstream.py
          python3 scripts/check_design.py
          python3 scripts/check_evidence.py
      - name: Install pinned Rust
        run: rustup show
      - name: Rust checks and real proof compatibility (host)
        env:
          ZKAPI_TEST_ARTIFACT_DIR: target/i02-fixtures
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace -- --nocapture
          cargo check --locked -p zkapi-solana-types --target wasm32-unknown-unknown
      - name: Upstream baseline
        run: |
          cargo test --locked --release --manifest-path vendor/ethereum-zkapi/protocol/rust/Cargo.toml
          cargo test --locked --release --workspace --manifest-path vendor/ethereum-zkapi/Cargo.toml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-real-proof-fixtures-not-svm
          path: target/i02-fixtures
          if-no-files-found: error
  svm:
    # Reproduce historical failures and require adopted I02-B success. Full Vault G1 is separate.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Check circuit archive reproducibility across checkout permissions
        run: python3 scripts/check_i02_reproducibility.py
      - name: Install fixed host and SBF toolchains
        run: |
          rustup show
          scripts/install_sbf_tools.sh
          scripts/install_i02_evm_tools.sh
      - name: Build real SBF and reproduce crypto / CU measurements
        run: |
          scripts/run_i02_svm.sh
          scripts/run_i02_layout2.sh
          cargo clippy --locked --manifest-path tests/svm/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path programs/i02-harness/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path programs/i02-layout2/Cargo.toml --all-targets -- -D warnings
          git diff --exit-code -- crates/zkapi-poseidon/src/constants.rs programs/i02-harness/src/vk.rs programs/i02-harness/src/tree_vk.rs tests/fixtures/tree
          git diff --exit-code -- programs/i02-layout2/src/profile.rs tests/fixtures/layout2 docs/evidence/I02B-reproducibility.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbf-I02-complete-full-Vault-G1-pending
          path: |
            docs/evidence/I02-svm-results.json
            docs/evidence/I02-transaction-sizes.json
            target/i02-sbf/*.so
            target/i02-sbf-wrong/*.so
            target/i02-transactions/*.bin
            docs/evidence/I02B-svm-results.json
            docs/evidence/I02B-summary.json
            docs/evidence/I02B-reproducibility.json
            target/i02b/sbf/*.so
            target/i02b/sbf-wrong/*.so
            target/i02b/circuit-source.tar
            target/i02b/evm-empty-root.json
          if-no-files-found: error
  vault:
    # I03 real Anchor ELF and EVM parity. I04 wallet/upload lifecycle remains separate.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Install pinned Vault toolchains
        run: |
          rustup show
          scripts/install_sbf_tools.sh
          scripts/install_i02_evm_tools.sh
      - name: Reproduce I03 Vault evidence
        env:
          RAYON_NUM_THREADS: '4'
        run: |
          bash scripts/run_i03.sh
          cargo clippy --locked --manifest-path programs/zkapi-vault/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path tests/svm/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path tools/vault-idl/Cargo.toml -- -D warnings
          git diff --exit-code -- tests/fixtures/vault tests/evm-vault/fixtures.json docs/contracts/zkapi_vault.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: I03-Anchor-Vault-test-profile
          path: |
            target/i03-sbf/*.so
            target/i03-sbf-wrong/*.so
            target/i03/*traces*.json
            target/i03/*evm*.json
            docs/contracts/zkapi_vault.json
            docs/evidence/I03*.json
          if-no-files-found: error
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install contract validation tools
        run: |
          python3 -m venv /tmp/zkapi-contract-venv
          /tmp/zkapi-contract-venv/bin/pip install openapi-spec-validator==0.7.2 jsonschema==4.26.0
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
      - name: Validate schemas and disposable PostgreSQL constraints
        run: |
          python3 work/design/generate_contracts.py --check
          /tmp/zkapi-contract-venv/bin/python scripts/check_openapi_contract.py
          PATH="/usr/lib/postgresql/16/bin:$PATH" python3 scripts/check_ledger_contract.py
  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Pinned npm
        run: npm install --global npm@11.9.0
      - run: npm ci --ignore-scripts
      - run: npm run typecheck && npm test
      - name: Upstream SDK baseline
        working-directory: vendor/ethereum-zkapi
        run: npm ci --ignore-scripts && npm run test:sdk
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: vendor/ethereum-zkapi/zkapi-clientd/go.sum
      - name: Upstream Go baseline
        working-directory: vendor/ethereum-zkapi/zkapi-clientd
        env:
          GOTOOLCHAIN: local
        run: |
          umask 022
          go test -mod=readonly ./...
