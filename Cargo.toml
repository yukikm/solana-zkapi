[workspace]
resolver = "2"
members = ["crates/zkapi-solana-types", "crates/zkapi-solana-crypto", "crates/zkapi-poseidon", "crates/zkapi-layout2", "crates/zkapi-tree-prover"]
exclude = ["vendor/ethereum-zkapi", "programs/i02-harness", "programs/i02-layout2", "tests/svm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace.dependencies]
ark-bn254 = "=0.5.0"
ark-ec = "=0.5.0"
ark-ed-on-bn254 = "=0.5.0"
ark-ff = "=0.5.0"
ark-groth16 = "=0.5.0"
ark-serialize = "=0.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.10.9"
hex = "=0.4.3"
thiserror = "2.0"
zkapi-core = { path = "vendor/ethereum-zkapi/protocol/rust/crates/zkapi-core" }
zkapi-proof = { path = "vendor/ethereum-zkapi/protocol/rust/crates/zkapi-proof" }
zkapi-types = { path = "vendor/ethereum-zkapi/protocol/rust/crates/zkapi-types" }
zkapi-solana-types = { path = "crates/zkapi-solana-types" }

[profile.test]
opt-level = 2
