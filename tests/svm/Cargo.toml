[workspace]
[package]
name = "zkapi-i02-svm"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
default-run = "zkapi-i02-svm"
[dependencies]
litesvm = "=0.6.1"
solana-sdk = "=2.2.1"
solana-compute-budget = "=2.2.0"
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }
bincode = "=1.3.3"
serde_json = "1.0"
hex = "=0.4.3"
sha2 = "=0.10.9"
base64 = "=0.22.1"
anchor-lang = "=0.31.1"
zkapi-vault = { path = "../../programs/zkapi-vault", features = ["no-entrypoint"] }
ark-bn254 = "=0.5.0"
ark-ff = "=0.5.0"
ark-ec = "=0.5.0"
zkapi-solana-crypto = { path = "../../crates/zkapi-solana-crypto" }
zkapi-poseidon = { path = "../../crates/zkapi-poseidon" }
zkapi-layout2 = { path = "../../crates/zkapi-layout2" }
[profile.dev]
opt-level = 2
[profile.test]
opt-level = 2
