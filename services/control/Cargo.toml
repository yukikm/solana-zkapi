[package]
name = "zkapi-control"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.104"
ark-bn254 = "=0.5.0"
ark-ed-on-bn254 = "=0.5.0"
ark-ec = "=0.5.0"
ark-ff = "=0.5.0"
ark-groth16 = "=0.5.0"
ark-serialize = "=0.5.0"
axum = "=0.8.9"
base64 = "=0.22.1"
bs58 = "=0.5.1"
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
fs2 = "=0.4.3"
hex = "=0.4.3"
hmac = "=0.12.1"
num-bigint = "=0.4.8"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
rand = "=0.8.5"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
serde_jcs = "=0.1.0"
sha2 = "=0.10.9"
solana-pubkey = { version = "=2.2.1", features = ["curve25519"] }
subtle = "=2.6.1"
thiserror = "=2.0.18"
tokio = { version = "=1.52.0", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "process", "io-util"] }
tokio-postgres = { version = "=0.7.18", features = ["with-uuid-1", "with-serde_json-1"] }
uuid = { version = "=1.27.0", features = ["v4", "serde"] }
zkapi-core = { path = "../../vendor/ethereum-zkapi/protocol/rust/crates/zkapi-core" }
zkapi-proof = { path = "../../vendor/ethereum-zkapi/protocol/rust/crates/zkapi-proof" }
zkapi-types = { path = "../../vendor/ethereum-zkapi/protocol/rust/crates/zkapi-types" }
zkapi-solana-types = { path = "../../crates/zkapi-solana-types" }
zkapi-solana-crypto = { path = "../../crates/zkapi-solana-crypto" }
zkapi-layout2 = { path = "../../crates/zkapi-layout2" }

[dev-dependencies]
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"
zkapi-tree-prover = { path = "../../crates/zkapi-tree-prover" }

[profile.test]
opt-level = 2
