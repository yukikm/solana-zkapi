[package]
name = "zkapi-challenger"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]

[dependencies]
ark-bn254 = "=0.5.0"
ark-groth16 = "=0.5.0"
ark-serialize = "=0.5.0"
fs2 = "=0.4.3"
hex = "=0.4.3"
rand = "=0.8.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
serde_jcs = "=0.1.0"
sha2 = "=0.10.9"
thiserror = "=2.0.18"
tokio = { version = "=1.52.0", features = ["macros", "rt-multi-thread"] }
tokio-postgres = { version = "=0.7.18", features = ["with-uuid-1"] }
uuid = { version = "=1.27.0", features = ["serde", "v4"] }
zkapi-control = { path = "../control" }
zkapi-indexer = { path = "../indexer" }
zkapi-layout2 = { path = "../../crates/zkapi-layout2" }
zkapi-tree-prover = { path = "../../crates/zkapi-tree-prover" }
zkapi-solana-types = { path = "../../crates/zkapi-solana-types" }

[dev-dependencies]
tempfile = "=3.27.0"
base64 = "=0.22.1"

[profile.test]
opt-level = 2
