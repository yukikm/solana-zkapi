[package]
name = "zkapi-poseidon"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
[features]
# Research variant; the original arithmetic remains the default.
research-dot-product = []
[dependencies]
ark-bn254 = { version = "=0.5.0", default-features = false, features = ["scalar_field"] }
ark-ff = { version = "=0.5.0", default-features = false }
[dev-dependencies]
zkapi-core = { path = "../../vendor/ethereum-zkapi/protocol/rust/crates/zkapi-core" }
