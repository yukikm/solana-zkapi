[package]
name = "zkapi-client-prover"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "=1.0.104"
ark-bn254 = "=0.5.0"
ark-ec = "=0.5.0"
ark-ed-on-bn254 = "=0.5.0"
ark-ff = "=0.5.0"
ark-groth16 = "=0.5.0"
ark-relations = "=0.5.1"
ark-serialize = "=0.5.0"
base64 = "=0.22.1"
bs58 = "=0.5.1"
ed25519-dalek = "=2.2.0"
hex = "=0.4.3"
hmac = "=0.12.1"
num-bigint = "=0.4.8"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
rand = "=0.8.5"
# Shared wire.rs uses only reqwest::Url; compile the URL parser without an HTTP client.
reqwest = { package = "url", version = "=2.5.8" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
serde_jcs = "=0.1.0"
sha2 = "=0.10.9"
subtle = "=2.6.1"
thiserror = "=2.0.21"
uuid = { version = "=1.27.0", features = ["v4", "serde", "js"] }
zkapi-core = { path = "../../../vendor/ethereum-zkapi/protocol/rust/crates/zkapi-core" }
zkapi-proof = { path = "../../../vendor/ethereum-zkapi/protocol/rust/crates/zkapi-proof" }
zkapi-types = { path = "../../../vendor/ethereum-zkapi/protocol/rust/crates/zkapi-types" }
zkapi-solana-types = { path = "../../../crates/zkapi-solana-types" }
zkapi-solana-crypto = { path = "../../../crates/zkapi-solana-crypto" }
zkapi-tree-prover = { path = "../../../crates/zkapi-tree-prover" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.2.17", features = ["custom"] }

[profile.release]
opt-level = 3
lto = "thin"

[profile.test]
opt-level = 2
