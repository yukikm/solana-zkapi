[package]
name = "zkapi-client-verify"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.104"
base64 = "=0.22.1"
bs58 = "=0.5.1"
ed25519-dalek = "=2.2.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
zkapi-control = { path = "../../../services/control" }
zkapi-core = { path = "../../../vendor/ethereum-zkapi/protocol/rust/crates/zkapi-core" }
zkapi-proof = { path = "../../../vendor/ethereum-zkapi/protocol/rust/crates/zkapi-proof" }
zkapi-types = { path = "../../../vendor/ethereum-zkapi/protocol/rust/crates/zkapi-types" }
zkapi-solana-types = { path = "../../../crates/zkapi-solana-types" }

[dev-dependencies]
ark-bn254 = "=0.5.0"
ark-ec = "=0.5.0"
ark-groth16 = "=0.5.0"
ark-serialize = "=0.5.0"
hex = "=0.4.3"
rand = "=0.8.5"
uuid = { version = "=1.27.0", features = ["v4", "serde"] }
zkapi-solana-crypto = { path = "../../../crates/zkapi-solana-crypto" }
ark-ed-on-bn254 = "=0.5.0"
ark-ff = "=0.5.0"

[profile.test]
opt-level = 2
